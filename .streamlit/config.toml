# Tema de la marca: negro de fondo, blanco para el resto.
#
# El primario es blanco y no un color: así el único color de la pantalla es el de
# las alertas. Si los filtros y las pestañas también tuvieran color, el rojo
# dejaría de significar "riesgo de quiebre" y pasaría a ser decoración.

[theme]
base = "dark"
backgroundColor = "#0A0A0B"
secondaryBackgroundColor = "#151517"
textColor = "#F0EFEC"
primaryColor = "#FFFFFF"
